
#---standard pioneer footprint---
#---(in meters)---

footprint: [[-0.02, -0.02], [-0.02, 0.02], [0.02, 0.02], [0.02, -0.02]] 
#Original: footprint: [[-0.16, -0.11], [-0.16, 0.11], [0.16, 0.11], [0.16, -0.11]] - Changes made by Team 5
footprint_padding: 0.02

transform_tolerance: 0.2
map_type: costmap

always_send_full_costmap: true

obstacle_layer:
 enabled: true
 obstacle_range: 3.0
 raytrace_range: 4.0
 inflation_radius: 0.12
 track_unknown_space: true
 combination_method: 1

 observation_sources: laser_scan_sensor
 laser_scan_sensor: {data_type: LaserScan, topic: scan, marking: true, clearing: true}


inflation_layer:
  enabled:              true
  cost_scaling_factor:  8.5  # exponential rate at which the obstacle cost drops off (default: 10)
  inflation_radius:     0.06  #Original is 0.5 - Changes made by Team 5

static_layer:
  enabled:              true
  map_topic:            "/map"
